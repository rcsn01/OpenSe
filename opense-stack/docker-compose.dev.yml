# ─────────────────────────────────────────────────────────────
# docker-compose.dev.yml
# Mount the monorepo source and run Vite dev servers in containers.
# No image build needed — uses the stock Node image directly.
#
# Usage:
#   cd opense-stack
#   docker compose -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────
name: opense-dev

x-base: &base
  image: node:22-alpine
  working_dir: /app
  volumes:
    - .:/app
    - pnpm-store:/app/.pnpm-store
  # Install deps on first run, then start the dev server
  entrypoint: ["/bin/sh", "-c"]

services:
  # ── shared one-time install ────────────────────────────────
  install:
    <<: *base
    command:
      - |
        corepack enable &&
        corepack prepare pnpm@9.15.0 --activate &&
        pnpm install --frozen-lockfile

  # ── web apps ───────────────────────────────────────────────
  admin:
    <<: *base
    depends_on:
      install:
        condition: service_completed_successfully
    command:
      - |
        corepack enable &&
        corepack prepare pnpm@9.15.0 --activate &&
        pnpm --filter @repo/admin dev
    ports:
      - "5990:5990"

  accounts:
    <<: *base
    depends_on:
      install:
        condition: service_completed_successfully
    command:
      - |
        corepack enable &&
        corepack prepare pnpm@9.15.0 --activate &&
        pnpm --filter @repo/accounts dev
    ports:
      - "5991:5991"

  etl:
    <<: *base
    depends_on:
      install:
        condition: service_completed_successfully
    command:
      - |
        corepack enable &&
        corepack prepare pnpm@9.15.0 --activate &&
        pnpm --filter @repo/etl dev
    ports:
      - "5992:5992"

  opense:
    <<: *base
    depends_on:
      install:
        condition: service_completed_successfully
    command:
      - |
        corepack enable &&
        corepack prepare pnpm@9.15.0 --activate &&
        pnpm --filter @repo/opense dev
    ports:
      - "5994:5994"

  stoqr:
    <<: *base
    depends_on:
      install:
        condition: service_completed_successfully
    command:
      - |
        corepack enable &&
        corepack prepare pnpm@9.15.0 --activate &&
        pnpm --filter @repo/stoqr dev
    ports:
      - "5993:5993"

  ui-design:
    <<: *base
    depends_on:
      install:
        condition: service_completed_successfully
    command:
      - |
        corepack enable &&
        corepack prepare pnpm@9.15.0 --activate &&
        pnpm --filter @repo/ui-design dev
    ports:
      - "5999:5999"

volumes:
  pnpm-store:
