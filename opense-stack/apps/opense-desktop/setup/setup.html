<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSe Desktop Setup</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #142033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(460px, calc(100vw - 48px));
        background: #ffffff;
        border: 1px solid #d9dee8;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(20, 32, 51, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 22px;
        color: #5d6a7d;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 650;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        height: 44px;
        border: 1px solid #b8c0ce;
        border-radius: 6px;
        padding: 0 12px;
        font: inherit;
      }

      input:focus {
        border-color: #1f6feb;
        outline: 3px solid rgba(31, 111, 235, 0.14);
      }

      button {
        width: 100%;
        height: 44px;
        margin-top: 16px;
        border: 0;
        border-radius: 6px;
        background: #1f6feb;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.7;
      }

      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #b42318;
        font-size: 13px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect OpenSe Desktop</h1>
      <p>Enter the hosted Accounts URL for this OpenSe instance.</p>
      <form id="setup-form">
        <label for="accounts-url">Accounts URL</label>
        <input
          id="accounts-url"
          name="accountsUrl"
          type="url"
          placeholder="https://accounts.example.com"
          autocomplete="url"
          required
        />
        <button type="submit">Connect</button>
        <div class="error" id="error" role="status" aria-live="polite"></div>
      </form>
    </main>
    <script src="/setup/setup.js"></script>
  </body>
</html>
