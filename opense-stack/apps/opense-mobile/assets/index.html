<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSe</title>
    <script src="./config.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 20px;
        color: #516078;
        line-height: 1.5;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 650;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        height: 48px;
        border: 1px solid #c8d0dd;
        border-radius: 8px;
        padding: 0 14px;
        font: inherit;
        background: #fff;
      }

      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 8px;
        margin-top: 14px;
        font: inherit;
        font-weight: 700;
        background: #1d4ed8;
        color: #fff;
      }

      button:disabled {
        opacity: 0.55;
      }

      .status {
        margin-top: 14px;
        color: #8a3a00;
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenSe</h1>
      <p>Connect this mobile app to your hosted Accounts instance.</p>
      <form id="setup-form">
        <label for="accounts-url">Accounts URL</label>
        <input id="accounts-url" name="accountsUrl" type="url" autocomplete="url" inputmode="url" placeholder="https://accounts.example.com" required />
        <button id="setup-button" type="submit">Connect</button>
      </form>
      <div id="setup-status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script src="./setup.js"></script>
  </body>
</html>
