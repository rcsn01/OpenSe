# ─────────────────────────────────────────────────────────────
# docker-compose.prod.yml
# Run production-built images behind nginx.
#
# Build all images first:
#   docker compose -f docker-compose.prod.yml build
#
# Then run them:
#   docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────
name: opense-prod

services:
  accounts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: accounts
    image: opense/accounts
    ports:
      - "5991:80"
    volumes:
      - ./apps/accounts/public/config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: etl
    image: opense/etl
    ports:
      - "5992:80"
    volumes:
      - ./apps/etl/public/config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped

  kb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: kb
    image: opense/kb
    ports:
      - "5995:80"
    volumes:
      - ./apps/kb/public/config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped

  opense:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: opense
    image: opense/opense
    ports:
      - "5994:80"
    volumes:
      - ./apps/opense/public/config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped

  stoqr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: stoqr
    image: opense/stoqr
    ports:
      - "5993:80"
    volumes:
      - ./apps/stoqr/public/config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped

  ui-design:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: ui-design
    image: opense/ui-design
    ports:
      - "5999:80"
    volumes:
      - ./apps/ui-design/public/config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped
