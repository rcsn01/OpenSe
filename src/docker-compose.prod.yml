# ─────────────────────────────────────────────────────────────
# docker-compose.prod.yml
# Run production-built images behind nginx.
#
# Build all images first (loads the repository-root .env):
#   pnpm docker:build
#
# Then run them:
#   pnpm docker:up
# ─────────────────────────────────────────────────────────────
name: opense-prod

x-frontend-environment: &frontend-environment
  VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
  VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY is required}
  VITE_GOOGLE_AUTH_ENABLED: ${VITE_GOOGLE_AUTH_ENABLED:-false}
  VITE_AUTH_COOKIE_DOMAIN: ${VITE_AUTH_COOKIE_DOMAIN:-}
  VITE_ACCOUNTS_URL: ${VITE_ACCOUNTS_URL:-http://localhost:5991}
  VITE_ETL_PUBLIC_URL: ${VITE_ETL_PUBLIC_URL:-http://localhost:5992}
  VITE_OPEN_KB_PUBLIC_URL: ${VITE_OPEN_KB_PUBLIC_URL:-http://localhost:5995}
  VITE_OPENSE_PUBLIC_URL: ${VITE_OPENSE_PUBLIC_URL:-http://localhost:5994}
  VITE_STOQR_PUBLIC_URL: ${VITE_STOQR_PUBLIC_URL:-http://localhost:5993}
  VITE_UI_PUBLIC_URL: ${VITE_UI_PUBLIC_URL:-http://localhost:5999}

services:
  accounts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: accounts
    image: opense/accounts
    ports:
      - "5991:80"
    environment: *frontend-environment
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: etl
    image: opense/etl
    ports:
      - "5992:80"
    environment: *frontend-environment
    restart: unless-stopped

  kb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: kb
    image: opense/kb
    ports:
      - "5995:80"
    environment: *frontend-environment
    restart: unless-stopped

  opense:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: opense
    image: opense/opense
    ports:
      - "5994:80"
    environment: *frontend-environment
    restart: unless-stopped

  stoqr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: stoqr
    image: opense/stoqr
    ports:
      - "5993:80"
    environment: *frontend-environment
    restart: unless-stopped

  ui-design:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: ui-design
    image: opense/ui-design
    ports:
      - "5999:80"
    environment: *frontend-environment
    restart: unless-stopped
