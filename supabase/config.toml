# OpenSe Unified Supabase Project
# Combines ETL and StoQR schemas into a single Supabase instance

project_id = "opense-stack"

[api]
enabled = true
port = 54321
schemas = ["public", "etl", "stoqr", "open_kb", "graphql_public"]
extra_search_path = ["public", "etl", "stoqr", "open_kb", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Keep reset/push flows schema-only by default, especially for linked remotes.
# Run seed files explicitly through ./setup.sh when demo/reference data is needed.
enabled = false
sql_paths = [
	"./seeds/00_cleanup.sql",
	"./seeds/10_auth_users.sql",
	"./seeds/20_public_core.sql",
	"./seeds/30_etl_core.sql",
	"./seeds/40_stoqr_reference_membership.sql",
	"./seeds/50_stoqr_catalog_inventory.sql",
	"./seeds/55_stoqr_reports_demo.sql",
	"./seeds/56_stoqr_procurement_workflows.sql",
	"./seeds/57_open_kb_demo.sql",
	"./seeds/60_admin_audit.sql",
	"./seeds/90_synthetic_volume.sql"
]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
pop3_port = 54325
smtp_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5174", "http://127.0.0.1:5175", "opense://mobile/accounts/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
port = 54327
backend = "postgres"

[functions.send-stoqr-alert-notifications]
verify_jwt = false

[functions.open-kb-github-webhook]
verify_jwt = false

[functions.open-kb-slack-events]
verify_jwt = false

[functions.open-kb-github-oauth]
verify_jwt = false

[functions.open-kb-slack-oauth]
verify_jwt = false

[functions.open-kb-github-sync-worker]
verify_jwt = false

[functions.open-kb-slack-sync-worker]
verify_jwt = false
