version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fts-app
    ports:
      - "5000:5000"
    environment:
      # Example connection string for the db service below
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/inventorydb
      - JWT_SECRET_KEY=super-secret-change-me
      - UPLOAD_FOLDER=/app/uploads
    depends_on:
      - db
    volumes:
      - uploads-data:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: fts-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=inventorydb
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
  uploads-data:
